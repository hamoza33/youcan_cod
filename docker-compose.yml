services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - postgres
      - redis
    ports:
      - "8124:3000"
    command: sh -c "npx prisma migrate deploy && npm run db:seed && node .next/standalone/server.js"

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - postgres
      - redis
    command: sh -c "npx prisma migrate deploy && npm run worker"

volumes:
  postgres_data:
